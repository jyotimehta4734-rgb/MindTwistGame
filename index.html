<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Socho, Samjho, Jeeto! - MindTwist Game</title>
<style>
:root{--bg:#0f0f1e;--panel:#1c1c34;--yellow:#ffdd00;--neon:#00e5ff;--red:#ff526e;--green:#39ff82;--text:#f0f0ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-weight:700}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);border-bottom:4px solid var(--yellow);padding:12px 20px}
header .t{color:var(--yellow);font-size:26px}
#lv{color:var(--neon);font-size:20px}#sc{color:var(--green);font-size:20px}
main{max-width:900px;margin:0 auto;padding:20px}
.box{background:var(--panel);border:3px solid var(--neon);border-radius:14px;padding:28px;text-align:center}
.box h2{color:var(--yellow);font-size:28px;margin:0 0 12px}
.box p{font-size:20px;color:var(--neon);margin:10px 0}
button.b{font:inherit;font-size:22px;color:var(--c,var(--neon));background:var(--bg);border:3px solid var(--c,var(--neon));border-radius:12px;padding:12px 24px;cursor:pointer}
button.b:hover{background:var(--c,var(--neon));color:var(--bg)}
input#nm{font:inherit;font-size:24px;text-align:center;color:var(--text);background:var(--bg);border:3px solid var(--neon);border-radius:12px;padding:12px;width:100%;max-width:340px}
#q{border-color:var(--yellow);margin-bottom:20px}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
#opts button{font-size:24px;padding:22px}
#bar{display:flex;justify-content:space-around;font-size:22px;margin-bottom:10px}
#tm{color:var(--red)}#ht{color:var(--yellow)}
#area{position:relative;height:380px;background:var(--panel);border:3px solid var(--neon);border-radius:14px;overflow:hidden}
#tg{position:absolute;width:190px;height:80px;padding:0;touch-action:manipulation}
#hint{text-align:center;color:var(--neon);font-size:18px;padding:12px}
#cr{text-align:center;color:var(--yellow);font-size:17px;padding:8px 12px 18px;border-top:2px solid var(--panel)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px}
#dlg{background:var(--panel);border:4px solid var(--c);border-radius:14px;padding:26px 34px;max-width:480px;text-align:center;font-size:22px}
#dlg button{margin-top:18px}
@media(max-width:560px){#opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><span id="lv"></span><span class="t">Socho, Samjho, Jeeto!</span><span id="sc">Score: 0</span></header>
<main id="m"></main>
<div id="hint"></div>

<div id="ov"><div id="dlg"><div id="dm"></div><button class="b" id="ok">OK</button></div></div>
<script>
const WRONG=["Arey re! Dimag ki batti gul! 💡❌ Try again!","Bilkul galat! Thoda badaam khao! 🧠","Oho! Ek baar aur socho! 🧠"];
const S=[
{t:"Ye kaun hai? 🤔",e:"🐘",o:["Sher","Haathi","Billi","Bandar"],a:1,w:"Haathi ko billi bol diya?! 🐘😂"},
{t:"Ye kaun hai? 🤔",e:"🦁",o:["Sher","Gadha","Kutta","Bhalu"],a:0,w:"Sher ghussa ho gaya! Dobara dekho! 🦁"},
{t:"Ye kaun hai? 🤔",e:"🐒",o:["Machhli","Bandar","Tota","Kachhua"],a:1,w:"Arey! Yeh toh pedon par kood raha hai! 🐒"},
{t:"Alag kaun hai? 🕵️",e:"🍎 🍌 🚗 🍇",o:["Seb","Kela","Gaadi","Angoor"],a:2,w:"Gaadi phal nahi hoti! Khayoge kya? 🚗😋"},
{t:"Gaay kya bolti hai? 🐮",e:"🐮",o:["Bhau-Bhau","Myaau","Muu","Cheen-Cheen"],a:2,w:"Gaay ne bhau-bhau bola toh kutta bhi hans padega! 🐶😂"},
{t:"Kitne seb hain? 🔢",e:"🍎🍎🍎🍎🍎",o:["3","4","5","6"],a:2,w:"Ungli se gino, seb gayab nahi honge! 🍎"},
{t:"Kele ka rang kaisa hota hai? 🎨",e:"🍌",o:["Laal","Peela","Neela","Hara"],a:1,w:"Neela kela? Bandar bhi hairan hai! 🐒"},
{catch:1},
{t:"Alag kaun hai? 🕵️",e:"🐶 🐱 🐮 ⚽",o:["Kutta","Billi","Gaay","Football"],a:3,w:"Football ko dudh kaun pilayega? ⚽🥛"},
{t:"Din mein aasman mein kaun chamakta hai? ☀️",e:"🌞",o:["Chand","Suraj","Taara","Bijli"],a:1,w:"Chand toh so raha hai abhi! 🌙😴"},
{t:"If a farmer has 10 cows, and all but 6 die, how many are left?",o:["A) 4","B) 6","C) 0","D) 10"],a:1,x:"‘All but 6 die’ matlab 6 bach gaye! Sirf 6 cows zinda hain.",h:"Dhyan se padho, sawal thoda chalaak hai!"},
{t:"Solve immediately:  5 + 5 x 0 + 5",o:["A) 0","B) 10","C) 5","D) 25"],a:1,x:"BODMAS rule: pehle multiplication! 5 x 0 = 0, so 5 + 0 + 5 = 10.",sp:1,h:"Speed challenge! 5 second mein jawab do aur bonus pao ⚡"}
];
let name="",score=0,i=0,t0=0,hits=0,left=20,mv=null,cd=null,cb=null;
const $=id=>document.getElementById(id),m=$("m");
const esc=s=>{const d=document.createElement("div");d.textContent=s;return d.innerHTML};
const win=()=>"Wah "+esc(name)+"! Aap toh Chhote Einstein nikle! 👑";
function upd(){$("sc").textContent="Score: "+score}
function dlg(msg,c,cbk){$("dm").innerHTML=msg;$("dlg").style.setProperty("--c",c);$("ok").style.setProperty("--c",c);cb=cbk;$("ov").style.display="flex";$("ok").focus()}
$("ok").onclick=()=>{$("ov").style.display="none";const f=cb;cb=null;if(f)f()};
function stop(){clearInterval(mv);clearInterval(cd)}
function home(){stop();$("lv").textContent="";
m.innerHTML='<div class="box"><h2>Welcome, Chhote Einstein! 🧠</h2><p>Tasveer pehchano, dimag lagao, button pakdo!</p><p style="color:var(--text)">Pehle apna naam batao 👇</p><input id="nm" maxlength="20" placeholder="Apna naam likho" autocomplete="off"><br><br><button class="b" style="--c:var(--yellow);font-size:28px" id="go">START GAME</button></div>';
$("nm").value=name;$("go").onclick=start;$("nm").onkeydown=e=>{if(e.key==="Enter")start()};
$("hint").textContent="Ready? Naam likho aur dimag ki batti jalao! 💡"}
function start(){const n=$("nm").value.trim();if(!n){dlg("Arey! Pehle apna naam toh batao! 😄","var(--red)",()=>$("nm").focus());return}
name=n;score=0;i=0;upd();show()}
function show(){stop();if(i>=S.length){end();return}
const d=S[i];
if(d.catch){reflex();return}
$("hint").textContent=(d.sp?"SAMJHO: ":"SOCHO: ")+(d.h||"Tasveer dekho aur sahi jawab chuno! 🎯");
m.innerHTML='<div class="box" id="q"><div style="font-size:'+(d.e?22:26)+'px;color:'+(d.e?'var(--neon)':'var(--text)')+'">'+d.t+'</div>'+(d.e?'<div style="font-size:80px;line-height:1.3">'+d.e+'</div>':'')+'</div><div id="opts"></div>';
d.o.forEach((t,k)=>{const b=document.createElement("button");b.className="b";b.textContent=t;b.onclick=()=>ans(k);$("opts").appendChild(b)});t0=Date.now()}
function ans(k){const d=S[i];
if(k===d.a){let p=100,n="";if(d.sp&&(Date.now()-t0)/1000<=5){p+=50;n="<br>⚡ Speed bonus +50!"}
score+=p;upd();dlg(win()+(d.x?"<br><br>"+d.x:"")+"<br><br>+"+p+" points"+n,"var(--green)",()=>{i++;show()})}
else{score=Math.max(0,score-10);upd();dlg((d.w||WRONG[Math.random()*WRONG.length|0])+"<br><br>(-10 points)","var(--red)")}}
function reflex(){$("hint").textContent="JEETO: Button ko 20 second mein 3 baar pakdo!";
m.innerHTML='<div id="bar"><span id="tm"></span><span id="ht"></span></div><div id="area"><button class="b" id="tg" style="--c:var(--yellow)">CLICK ME!</button></div>';
$("tg").onpointerdown=e=>{e.preventDefault();hit()};hits=0;left=20;lbl();
dlg("Button har 1.5 second mein bhagega! ⚡<br>20 second mein usse 3 baar pakdo.<br>Ready, steady, CLICK!","var(--neon)",round)}
function lbl(){$("tm").textContent="Time left: "+left+"s";$("ht").textContent="Hits: "+hits+" / 3"}
function mvT(){const a=$("area");if(!a)return;const t=$("tg");t.style.left=(5+Math.random()*Math.max(1,a.clientWidth-195))+"px";t.style.top=(5+Math.random()*Math.max(1,a.clientHeight-85))+"px"}
function round(){stop();hits=0;left=20;lbl();mvT();mv=setInterval(mvT,1500);
cd=setInterval(()=>{left--;lbl();if(left<=0){stop();score=Math.max(0,score-10);upd();dlg("Time Up!<br>Arey! Aapki ungli toh kachhua nikli! 🐢<br>Phir koshish karo, Champion! (-10 points)","var(--red)",round)}},1000)}
function hit(){if(!cd||left<=0)return;hits++;lbl();
if(hits>=3){stop();score+=150;upd();dlg(win()+"<br><br>Teen baar pakad liya! +150 points 🎉","var(--green)",()=>{i++;show()})}
else{mvT();clearInterval(mv);mv=setInterval(mvT,1500)}}
function end(){$("lv").textContent="";$("hint").textContent="📸 Shabaash! Phone se is certificate ki photo kheench lo!";
m.innerHTML='<div class="box" style="border:8px double var(--yellow);padding:34px"><p style="color:var(--neon);font-size:22px;margin:0">🌟 CERTIFICATE OF CHAMPION 🌟</p><p style="color:var(--text);margin:14px 0 0">Yeh certificate diya jata hai</p><div id="nmo" style="font-size:44px;color:var(--yellow);margin:10px 0"></div><p style="color:var(--text)">Socho, Samjho, Jeeto! mein shaandaar khelne ke liye 🏆</p><p style="color:var(--green)">Final score: '+score+'</p><p style="font-size:26px;color:var(--yellow)">Aap toh Chhote Einstein nikle! 👑</p></div><br><div style="text-align:center"><button class="b" id="pa">PLAY AGAIN</button></div>';
$("nmo").textContent=name;$("pa").onclick=home}
home();
</script>
</body>
</html>
